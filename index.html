<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adventure Game Builder</title>
    <script>
      window.addEventListener("error", (event) => {
        const status = document.getElementById("editor-startup");
        if (status && (event.target === window || event.target instanceof HTMLScriptElement)) {
          status.setAttribute("role", "alert");
          status.textContent = "The editor could not load. Reload this page to retry.";
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"><p id="editor-startup" role="status">Opening Adventure Game Builder…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
