name: CI

on:
  pull_request:
    branches:
      - release/staging
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One owner per Vitest suite; safe builds typecheck each app/package once.
      # Compiler tests use checked-in artifacts/fakes, never Blender regeneration.
      - name: Validate application, workspaces, and compiler
        run: npm run ci
