return `<div class="panel-head"><div class="eyebrow">Node Inspector</div><h3 style="margin-top:5px">${esc(n.title)}</h3><span class="pill">${esc(cfg.group.toUpperCase())} · ${esc(n.type)}</span></div><div class="section"><div class="field"><label>Node label</label><input class="input" id="node-title" value="${esc(n.title)}"></div>${fields}<div class="output-note">${n.type.startsWith('wait_')?'This node waits for a gameplay event. It does not automatically trigger a conversation on arrival.':n.type==='spawn'?'Set the initial spawn for this entry path. Area spawn markers remain world definitions.':n.type==='inventory_check'?'This condition has separate True and False output ports. Both can connect to further nodes.':'Execution happens when incoming flow reaches this node; engine events and actions must be validated.'}</div></div><div class="section"><h4>Connections</h4><div class="tiny">Inbound: ${graph().edges.filter(e=>e.to===n.id).length} · Outbound: ${graph().edges.filter(e=>e.from===n.id).length}</div><div class="tiny" style="margin-top:7px">Cycles are valid only when event waits, timers or explicit loop guards prevent unbounded execution.</div></div><div class="section"><h4>References</h4><div class="ins-link"><span>◈ ${esc(n.data.npc||n.data.area||n.data.sequence||n.data.item||'GameProject')}</span>${actionBtn(n.data.npc?'View Asset':n.data.area?'Open Map':n.data.sequence?'Cinematics':'Details','open-ref')}</div></div><div class="section">${actionBtn('Delete node','graph-delete')} ${actionBtn('Duplicate','duplicate-node')}</div>`}
function graphPos(n){return {input:{x:n.x,y:n.y+45},default:{x:n.x+191,y:n.y+45},true:{x:n.x+191,y:n.y+43},false:{x:n.x+191,y:n.y+71}}}
function drawGraph(){if(state.page!=='story')return;const surf=$('#graph-surface'),edges=$('#edges-svg'),nodes=$('#nodes-layer');if(!surf)return;surf.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;edges.innerHTML=graph().edges.map(e=>{const a=graph().nodes.find(n=>n.id===e.from),b=graph().nodes.find(n=>n.id===e.to);if(!a||!b)return '';const p=graphPos(a)[e.port]||graphPos(a).default,q=graphPos(b).input,dx=Math.max(55,Math.abs(q.x-p.x)*.45),d=`M${p.x},${p.y} C${p.x+dx},${p.y} ${q.x-dx},${q.y} ${q.x},${q.y}`;return `<path class="edge ${esc(e.port)} ${state.edge===e.id?'selected':''}" d="${d}"/><path class="edge-hit" data-edge="${e.id}" d="${d}"/>${e.port!=='default'?`<text class="edge-label" x="${p.x+14}" y="${p.y-7}">${e.port==='true'?'YES':'NO'}</text>`:''}`}).join('');nodes.innerHTML=graph().nodes.map(n=>{const kind=KIND[n.type]?.group||'action';return `<div class="node ${kind} ${state.node===n.id?'selected':''}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="node-header" data-drag-node="${n.id}"><span>${esc(kind.toUpperCase())}</span><span class="node-badge">${n.type==='inventory_check'?'TRUE / FALSE':n.type.startsWith('wait_')?'WAIT':'FLOW'}</span></div><div class="node-title">${esc(n.title)}</div><div class="node-sub">${esc(nodeSummary(n))}</div>${kind!=='entry'?`<button aria-label="Input socket" class="socket input" data-socket="input" data-node="${n.id}" title="Connect incoming flow"></button>`:''}${n.type!=='end'?n.type==='inventory_check'||kind==='condition'?`<button class="socket output true ${state.connect?.from===n.id&&state.connect?.port==='true'?'chosen':''}" data-socket="true" data-node="${n.id}" title="Yes / true"></button><button class="socket output false ${state.connect?.from===n.id&&state.connect?.port==='false'?'chosen':''}" data-socket="false" data-node="${n.id}" title="No / false"></button>`:`<button class="socket output ${state.connect?.from===n.id?'chosen':''}" data-socket="default" data-node="${n.id}" title="Connect to next step"></button>`:''}</div>`}).join('');$('#story-inspector').innerHTML=storyInspectorHTML();const h=$('#graph-hint');if(h)h.textContent=state.connect?`Linking ${state.connect.from} (${state.connect.port}) → click a target input socket. Press Escape to cancel.`:'Drag nodes to rearrange · click right socket then left socket to connect · drag blank space to pan';}
function nodeSummary(n){const d=n.data||{};return n.type==='spawn'?`${d.area||'Area'} · ${d.spawn||'spawn marker'}`:n.type==='wait_interact'?`NPC: ${d.npc||'Select NPC'} · E to interact`:n.type==='cutscene'?`Cinematic: ${d.sequence||'Choose sequence'}`:n.type==='objective'?`${d.objective||'Define an objective'}`:n.type==='inventory_check'?`Item: ${d.item||'item'}?`:n.type==='wait_item'?`Wait until ${d.item||'item'} acquired`:n.type==='show_hud'?`${d.message||'Notification'}`:n.type==='on_new_game'?'Triggered once on a new run':n.type==='on_quest_start'?`Quest: ${d.quest||'quest'}`:n.type==='wait_location'?`Area: ${d.area||'area'}`:n.type==='wait_enemy'?`Enemy: ${d.enemy||'enemy'}`:n.type==='set_flag'?`${d.variable||'flag'} = ${d.value||'true'}`:KIND[n.type]?.label||'Configure node'}
function snapshot(){return JSON.stringify({nodes:graph().nodes,edges:graph().edges})}function pushHistory(){state.graphHistory.push(snapshot());state.graphHistory=state.graphHistory.slice(-60);state.graphFuture=[]}function undoGraph(){if(!state.graphHistory.length)return;state.graphFuture.push(snapshot());const s=JSON.parse(state.graphHistory.pop());graph().nodes=s.nodes;graph().edges=s.edges;state.node=null;state.edge=null;drawGraph()}function redoGraph(){if(!state.graphFuture.length)return;state.graphHistory.push(snapshot());const s=JSON.parse(state.graphFuture.pop());graph().nodes=s.nodes;graph().edges=s.edges;state.node=null;state.edge=null;drawGraph()}
function addNode(type){pushHistory();const n={id:'n'+Date.now().toString(36),type,title:KIND[type]?.label||type,x:Math.round((475-state.panX)/state.zoom),y:Math.round((230-state.panY)/state.zoom),data:{}};graph().nodes.push(n);state.node=n.id;state.edge=null;drawGraph();toast('Added '+n.title+' · drag to position and connect sockets')}
function deleteSelected(){if(state.edge){pushHistory();graph().edges=graph().edges.filter(e=>e.id!==state.edge);state.edge=null;drawGraph();return}if(!state.node)return;pushHistory();graph().nodes=graph().nodes.filter(n=>n.id!==state.node);graph().edges=graph().edges.filter(e=>e.from!==state.node&&e.to!==state.node);state.node=null;drawGraph()}
function zoomGraph(delta){state.zoom=Math.max(.42,Math.min(1.8,state.zoom*delta));drawGraph()}
function fitGraph(){const ns=graph().nodes;if(!ns.length)return;const zone=$('#graph-zone'),w=zone?.clientWidth||770,h=zone?.clientHeight||460;const minx=Math.min(...ns.map(n=>n.x)),miny=Math.min(...ns.map(n=>n.y)),maxx=Math.max(...ns.map(n=>n.x+191)),maxy=Math.max(...ns.map(n=>n.y+105));state.zoom=Math.max(.42,Math.min(1.1,Math.min((w-65)/(maxx-minx),(h-100)/(maxy-miny))));state.panX=(w-(maxx-minx)*state.zoom)/2-minx*state.zoom;state.panY=(h-(maxy-miny)*state.zoom)/2-miny*state.zoom;drawGraph()}
function toast(m){state.toast=m;$('#status-text').textContent=m}
function modalHTML(){return `<div class="modal-back"><div class="modal"><h3>${state.modal==='asset'?'Create Asset Draft':'New Story Graph'}</h3><p class="small">This prototype creates in-memory definitions only. No AI calls, GLB generation or game mutation occurs.</p><div class="field"><label>Name</label><input id="modal-name" class="input" placeholder="${state.modal==='asset'?'New Villager':'New Quest Graph'}"></div>${state.modal==='asset'?`<div class="field"><label>Category</label><select id="modal-category" class="select">${['Humans','Animals','Buildings','Foliage','Props'].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Schema constraints</label><select id="modal-schema" class="select"><option>Constrained</option><option>Extended</option><option>Custom</option></select></div>`:''}<div style="display:flex;justify-content:flex-end;gap:8px">${actionBtn('Cancel','close-modal')}${actionBtn('Create draft','confirm-modal','primary')}</div></div></div>`}
function placeholderHTML(){return `<div class="placeholder"><div class="placeholder-inner"><div style="font-size:55px;color:#c4d3b3">▣</div><h1 class="headline">Cinematics</h1><p class="small">Reserved for the next design pass: cinematic timeline, actors, cameras, audio and facial animation. Story graphs already reference cutscenes by ID.</p>${actionBtn('Back to Project Home','hub','primary')}</div></div>`}
function exportGraph(){const data={_note:'Editor design concept. This is not the production GameProject graph schema.',project:state.project,graph:graph().name,nodes:graph().nodes,edges:graph().edges};download('hollow-kingdom-story-concept.json',JSON.stringify(data,null,2),'application/json')}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function simulate(){const reached=['n1','n2','n3','n4','n5','n6'];const missing=graph().edges.filter(e=>!graph().nodes.some(n=>n.id===e.from)||!graph().nodes.some(n=>n.id===e.to));const cycle=graph().edges.some(e=>e.from===e.to);toast(`Design-time flow check: ${graph().nodes.length} nodes, ${graph().edges.length} connections${missing.length?`, ${missing.length} broken links`:''}${cycle?', self-cycle detected':''}. This is NOT a runtime simulation.`)}
window.addEventListener('message',e=>{if(e.data?.type==='hk-prototype-nav'&&e.data.page==='hub'){state.page='hub';render()}});
$('#home-logo').addEventListener('click',()=>{state.page='projects';state.modal=null;render()});$('#home-button').addEventListener('click',()=>{state.page='hub';render()});$('#preview-button').addEventListener('click',()=>toast('Preview is conceptual here. The real editor would launch an isolated RuntimeSession.'));
$('#screen').addEventListener('click',e=>{const b=e.target.closest('button');if(!b){const node=e.target.closest('.node');if(node&&state.page==='story'){state.node=node.dataset.node;state.edge=null;drawGraph();return}const edge=e.target.closest('[data-edge]');if(edge&&state.page==='story'){state.edge=edge.dataset.edge;state.node=null;drawGraph();toast('Selected connection · Delete removes this link')}return;}
if(b.dataset.page){state.page=b.dataset.page;state.toast='';render();return}if(b.dataset.asset){state.selectedAsset=b.dataset.asset;state.assetYaw=0;render();return}if(b.dataset.cat){state.category=b.dataset.cat;render();return}if(b.dataset.assetTab){state.assetTab=b.dataset.assetTab;render();return}if(b.dataset.bg){state.assetBG=b.dataset.bg;render();return}if(b.dataset.anim){state.anim=b.dataset.anim;state.playing=true;render();return}if(b.dataset.effect){state.effect=b.dataset.effect;render();return}if(b.dataset.graph){state.graph=b.dataset.graph;state.node=graph().nodes[0]?.id||null;state.connect=null;state.graphHistory=[];state.graphFuture=[];state.panX=22;state.panY=58;state.zoom=.8;render();return}if(b.dataset.newnode){addNode(b.dataset.newnode);return}
if(b.dataset.socket){e.stopPropagation();const nid=b.dataset.node,socket=b.dataset.socket;if(socket!=='input'){state.connect={from:nid,port:socket};drawGraph();return}if(state.connect&&state.connect.from!==nid){pushHistory();const existing=graph().edges.find(q=>q.from===state.connect.from&&q.port===state.connect.port);if(existing)graph().edges=graph().edges.filter(q=>q!==existing);graph().edges.push({id:'e'+Date.now().toString(36),from:state.connect.from,to:nid,port:state.connect.port});state.connect=null;drawGraph();toast('Connected nodes');}return}
if(b.dataset.act){const ac=b.dataset.act;switch(ac){case'open-project':state.page='hub';break;case'new-project':state.form=true;break;case'create-project':state.project=state.projectName||'Untitled RPG';state.form=false;state.page='hub';break;case'hub':state.page='hub';break;case'create-asset':state.modal='asset';break;case'new-graph':state.modal='graph';break;case'close-modal':state.modal=null;break;case'confirm-modal':{const name=$('#modal-name')?.value.trim()||'Untitled',cat=$('#modal-category')?.value||'Humans';if(state.modal==='asset'){const id='draft'+Date.now();const icons={Humans:'♙',Animals:'♞',Buildings:'⌂',Foliage:'♠',Props:'✦'};state.assets.unshift({id,name,cat,kind:'Uncompiled draft',symbol:icons[cat],color:'#657f6e',height:180,variant:'Draft',attach:'None',rig:cat==='Humans'});state.selectedAsset=id;state.assetTab='assets';state.category='All';}else{const key='g'+Date.now();state.graphs[key]={name,nodes:[],edges:[]};state.graph=key;state.node=null;state.graphHistory=[];state.graphFuture=[]}state.modal=null;toast('Created an in-memory draft, not published to the engine');break}case'toggle-skeleton':state.skeleton=!state.skeleton;break;case'asset-orbit':state.assetYaw+=.4;updateAssetVisuals();return;case'toggle-anim':state.playing=!state.playing;break;case'new-clip':state.anim='Custom Clip';break;case'new-effect':state.effect='Custom Effect';break;case'add-key':toast('Added a visual keyframe marker (concept only)');return;case'save-asset':toast('Asset edits retained in prototype memory · no GLB published');return;case'save-asset-new':{const a={...activeAsset(),id:'v'+Date.now(),name:activeAsset().name+' Variant'};state.assets.unshift(a);state.selectedAsset=a.id;state.category='All';toast('Saved an in-memory asset variant');break}case'graph-select':state.connect=null;drawGraph();return;case'graph-connect':if(!state.connect){state.connect={from:state.node||graph().nodes[0]?.id,port:'default'}}else state.connect=null;drawGraph();return;case'graph-delete':deleteSelected();return;case'duplicate-node':{const n=selectedNode();if(n){pushHistory();const x={...n,id:'n'+Date.now(),x:n.x+35,y:n.y+145,data:{...n.data}};graph().nodes.push(x);state.node=x.id;drawGraph()}return}case'graph-undo':undoGraph();return;case'graph-redo':redoGraph();return;case'zoom-in':zoomGraph(1.18);return;case'zoom-out':zoomGraph(.85);return;case'graph-fit':fitGraph();return;case'test-flow':simulate();return;case'export-graph':exportGraph();return;case'open-ref':{const n=selectedNode();state.page=n?.data.npc?'assets':n?.data.sequence?'cinematics':'map';if(n?.data.npc)state.selectedAsset=n.data.npc;break}}render();return}
const node=e.target.closest('.node');if(node&&state.page==='story'){state.node=node.dataset.node;state.edge=null;drawGraph()}
const edge=e.target.closest('[data-edge]');if(edge&&state.page==='story'){state.edge=edge.dataset.edge;state.node=null;drawGraph();toast('Selected connection · Delete removes this link')}
});
$('#screen').addEventListener('input',e=>{const t=e.target;if(t.id==='project-name'){state.projectName=t.value;return}if(t.id==='asset-search'){state.assetSearch=t.value;const caret=t.selectionStart;render();const el=$('#asset-search');if(el){el.focus();el.setSelectionRange(caret,caret)}return}if(t.dataset.aField){const a=activeAsset();let val=t.value;if(t.dataset.aField==='height')val=Math.max(10,Number(val)||10);a[t.dataset.aField]=val;if(t.dataset.aField==='color')updateAssetVisuals();return}if(t.dataset.nodeField){const n=selectedNode();if(!n)return;const k=t.dataset.nodeField;n.data[k]=t.type==='number'?Number(t.value):t.value;const nodeEl=$(`[data-node="${n.id}"].node`);if(nodeEl){const sub=nodeEl.querySelector('.node-sub');if(sub)sub.textContent=nodeSummary(n)}return}if(t.id==='node-title'){const n=selectedNode();if(n){n.title=t.value;const h=$(`[data-node="${n.id}"].node .node-title`);if(h)h.textContent=t.value}return}});
$('#screen').addEventListener('change',e=>{const t=e.target;if(t.dataset.aField||t.dataset.nodeField){toast('Updated in-memory draft property');return}});
let gesture=null;
$('#screen').addEventListener('pointerdown',e=>{if(state.page!=='story')return;const zone=$('#graph-zone');if(!zone||!zone.contains(e.target))return;const drag=e.target.closest('[data-drag-node]');if(e.target.closest('.socket'))return;if(drag){const n=graph().nodes.find(n=>n.id===drag.dataset.dragNode);if(!n)return;state.node=n.id;state.edge=null;pushHistory();gesture={mode:'node',id:n.id,x:e.clientX,y:e.clientY,ox:n.x,oy:n.y};zone.setPointerCapture(e.pointerId);drawGraph();e.preventDefault();return}if(e.target.closest('[data-edge]'))return;const block=e.target.closest('.node');if(block){state.node=block.dataset.node;state.edge=null;drawGraph();return}gesture={mode:'pan',x:e.clientX,y:e.clientY,ox:state.panX,oy:state.panY};zone.setPointerCapture(e.pointerId);zone.classList.add('dragging')});
$('#screen').addEventListener('pointermove',e=>{if(!gesture||state.page!=='story')return;if(gesture.mode==='pan'){state.panX=gesture.ox+e.clientX-gesture.x;state.panY=gesture.oy+e.clientY-gesture.y}else{const n=graph().nodes.find(n=>n.id===gesture.id);if(n){n.x=Math.round(gesture.ox+(e.clientX-gesture.x)/state.zoom);n.y=Math.round(gesture.oy+(e.clientY-gesture.y)/state.zoom)}}drawGraph()});
$('#screen').addEventListener('pointerup',()=>{gesture=null;$('#graph-zone')?.classList.remove('dragging')});$('#screen').addEventListener('pointercancel',()=>{gesture=null;$('#graph-zone')?.classList.remove('dragging')});
$('#screen').addEventListener('wheel',e=>{if(state.page==='story'&&$('#graph-zone')?.contains(e.target)){e.preventDefault();zoomGraph(e.deltaY<0?1.08:.92)}},{passive:false});
window.addEventListener('keydown',e=>{if(state.page!=='story'||e.target.closest('input,select,textarea'))return;const k=e.key.toLowerCase();if(k==='escape'){state.connect=null;drawGraph()}if(k==='delete'||k==='backspace')deleteSelected();if(k==='f')fitGraph();if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();undoGraph()}if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redoGraph()}});
let prev=0;function tick(t){if(t-prev>110){prev=t;if(state.page==='assets'&&state.playing){const a=activeAsset(),svg=$('#model-live');if(svg)svg.innerHTML=modelDraw(a,true)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
render();
</script>
